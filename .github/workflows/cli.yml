name: Go CLI CI

on:
  push:
    paths:
      - 'cli/**'
      - '.github/workflows/cli.yml'
  pull_request:
    paths:
      - 'cli/**'
      - '.github/workflows/cli.yml'

jobs:
  build-and-test:
    name: Build & Test CLI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go 1.26
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Check code formatting (gofmt)
        run: |
          if [ -n "$(gofmt -l cli/)" ]; then
            echo "The following files are not formatted properly with gofmt:"
            gofmt -l cli/
            exit 1
          fi

      - name: Run go vet
        run: |
          cd cli
          go vet ./...

      - name: Run tests with race detection
        run: |
          cd cli
          go test -v -race ./...

      - name: Build CLI binary
        run: |
          cd cli
          go build -v -o bin/relay main.go

      - name: Upload CLI build artifact
        uses: actions/upload-artifact@v4
        with:
          name: relay-cli-linux-amd64
          path: cli/bin/relay
