name: Node.js Server CI

on:
  push:
    paths:
      - 'server/**'
      - '.github/workflows/server.yml'
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/server.yml'

jobs:
  test:
    name: Lint, Integration Test & Coverage
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: webhookrelay
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: |
          cd server
          npm ci

      - name: Run linter
        run: |
          cd server
          npm run lint

      - name: Run database migrations and seed
        run: |
          cd server
          npm run db:migrate
          npm run db:seed
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/webhookrelay
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: webhookrelay

      - name: Run test suite & integration tests
        run: |
          cd server
          npm test
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/webhookrelay
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: webhookrelay
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: webhookrelay_jwt_secret_dev_key_2026

      - name: Run load benchmark test
        run: |
          cd server
          npm run test:load
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/webhookrelay
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: webhookrelay
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: webhookrelay_jwt_secret_dev_key_2026

      - name: Upload Server Logs Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-execution-logs
          path: server/logs/
          if-no-files-found: ignore
